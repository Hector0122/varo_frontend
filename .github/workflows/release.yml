# Publica un APK firmado como GitHub Release al hacer push de un tag `v*`
# (p. ej. `git tag v1.1.0 && git push origin v1.1.0`). La app compara su
# versión con la última release y ofrece actualizar (src/services/updates.ts).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caché de Gradle entre builds: el segundo release en adelante tarda bastante menos.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Config (URL de la API) y versión de la app desde el tag
        run: |
          echo "API_BASE_URL=${{ secrets.VARO_API_BASE_URL }}" > .env
          node scripts/generate-config.js
          printf "export const APP_VERSION: string | null = '%s';\n" "${GITHUB_REF_NAME#v}" > src/appVersion.ts
      - name: Keystore de release
        # Sin el secret se firma con la llave debug (sirve para probar, pero no
        # actualiza encima de un APK firmado con la llave de release).
        env:
          KEYSTORE: ${{ secrets.VARO_KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > android/app/varo-release.keystore; fi
      - name: Compilar APK
        working-directory: android
        env:
          VARO_KEYSTORE_PASSWORD: ${{ secrets.VARO_KEYSTORE_PASSWORD }}
          VARO_KEY_PASSWORD: ${{ secrets.VARO_KEY_PASSWORD }}
          VARO_KEY_ALIAS: ${{ secrets.VARO_KEY_ALIAS }}
        # Solo arm64: lo usa casi cualquier celular actual y compila 4 veces más rápido que las 4 arquitecturas.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PversionCode=${{ github.run_number }} -PversionName=${GITHUB_REF_NAME#v}
      - name: Publicar release
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk "varo-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "varo-${GITHUB_REF_NAME}.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
